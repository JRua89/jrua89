<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | John Rua</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --accent: #00ff87;
            --accent-secondary: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --gradient: linear-gradient(135deg, #00ff87 0%, #00d4ff 100%);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .card {
            max-width: 420px;
            padding: 40px 28px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        .mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 26px;
            color: #0a0a0a;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        button {
            font: inherit;
            font-weight: 600;
            padding: 12px 28px;
            border: 0;
            border-radius: 999px;
            background: var(--gradient);
            color: #0a0a0a;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .status {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="mark" aria-hidden="true">JR</div>
        <h1>You're offline</h1>
        <p>This page isn't cached yet. Reconnect and it'll load right up &mdash; the rest of the site is still available offline.</p>
        <button type="button" id="retry">Try again</button>
        <p class="status" id="status" role="status"></p>
    </main>

    <script>
        var status = document.getElementById('status');

        document.getElementById('retry').addEventListener('click', function () {
            location.reload();
        });

        function render() {
            if (navigator.onLine) {
                status.textContent = 'Back online — reloading…';
                location.reload();
            } else {
                status.textContent = 'Still no connection.';
            }
        }

        window.addEventListener('online', render);
    </script>
</body>
</html>
