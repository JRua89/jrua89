name = "johnrua-push"
main = "src/index.js"
compatibility_date = "2024-11-06"

# Serve the push API from the site's own origin, so the browser treats it as
# same-origin: no CORS, and no extra connect-src entry in the CSP.
routes = [
  { pattern = "johnrua.com/api/push/*", zone_name = "johnrua.com" }
]

# Subscription storage. Create with:
#   wrangler kv namespace create SUBSCRIPTIONS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "0c244e5a3d5c4e709b3c2d6ca7a1d83c"

[vars]
VAPID_SUBJECT = "mailto:jrua89@gmail.com"

# Secrets are NOT set here — they'd be committed. Set them with:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put PUSH_ADMIN_TOKEN
